<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directorio de Prensa — CROP 2026</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --border:#e5e7eb; --border2:#eef0f3;
    --text:#0f172a; --muted:#64748b; --muted2:#94a3b8;
    --accent:#4f46e5; --accent-soft:#eef2ff; --accent-text:#4338ca;
    --dark:#0f172a; --shadow:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
  .eyebrow{display:flex;align-items:center;gap:7px;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
  .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .actions{display:flex;flex-wrap:wrap;gap:8px}
  button,select,input{font-family:inherit}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 14px;font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--card);color:#334155;box-shadow:var(--shadow);transition:.15s}
  .btn:hover{background:#f8fafc}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:#4338ca}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:18px}
  .search{position:relative;margin-bottom:12px}
  .search input{width:100%;border:1px solid var(--border);background:#f8fafc;border-radius:9px;padding:11px 38px 11px 40px;font-size:14px;color:var(--text);transition:.15s}
  .search input:focus{outline:none;border-color:#a5b4fc;background:#fff;box-shadow:0 0 0 3px #eef2ff}
  .search svg.lead{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted2)}
  .search .clear{position:absolute;right:11px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;color:var(--muted2);display:none}
  .filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:900px){.filters{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.filters{grid-template-columns:1fr}}
  .sel{position:relative}
  .sel svg.ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted2);pointer-events:none}
  .sel svg.chev{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted2);pointer-events:none}
  select{width:100%;appearance:none;border:1px solid var(--border);background:#fff;border-radius:9px;padding:10px 30px 10px 34px;font-size:13.5px;color:#334155;box-shadow:var(--shadow);cursor:pointer}
  select:focus{outline:none;border-color:#a5b4fc;box-shadow:0 0 0 3px #eef2ff}
  .meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .count{font-size:14px;color:var(--muted)}
  .count b{color:var(--text)}
  .pageinfo{font-size:13px;color:var(--muted2)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:17px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.15s}
  .card:hover{border-color:#c7d2fe;box-shadow:0 4px 12px rgba(16,24,40,.08)}
  .card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .card h3{font-size:15px;font-weight:600;line-height:1.3}
  .card .role{font-size:13px;color:var(--muted);margin-top:2px}
  .tag{flex-shrink:0;background:var(--accent-soft);color:var(--accent-text);font-size:11px;font-weight:500;padding:4px 9px;border-radius:999px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag-infra{background:#e0f2fe;color:#075985}
  .tag-energia{background:#dcfce7;color:#166534}
  .tag-economia{background:#fef9c3;color:#854d0e}
  .tag-politica{background:#fee2e2;color:#991b1b}
  .tag-consumo{background:#fae8ff;color:#86198f}
  .tag-social{background:#e0e7ff;color:#3730a3}
  .tag-tecnologia{background:#cffafe;color:#155e75}
  .facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:11px;font-size:13px;color:#475569}
  .facts span{display:inline-flex;align-items:center;gap:5px}
  .facts svg{color:var(--muted2)}
  .divider{height:1px;background:var(--border2);margin:14px 0}
  .contact{display:flex;flex-direction:column;gap:8px;font-size:13px}
  .contact a{display:flex;align-items:center;gap:8px;color:#475569;text-decoration:none;overflow:hidden}
  .contact a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .contact a:hover{color:var(--accent)}
  .contact svg{color:var(--muted2);flex-shrink:0}
  .empty-field{color:var(--muted2);font-style:italic}
  .cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .cardbtns .b{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:500;padding:8px;border-radius:8px;cursor:pointer;transition:.15s;text-decoration:none;border:none;width:100%}
  .b-dark{background:var(--dark);color:#fff;border:none}
  .b-dark:hover{background:#334155}
  .b-ghost{background:#fff;color:#475569;border:1px solid var(--border)}
  .b-ghost:hover{background:#f8fafc}
  .b-whatsapp{background:#25D366;color:#fff;border:none}
  .b-whatsapp:hover{background:#1fb959}
  .b-disabled{background:#f1f5f9;color:#94a3b8;cursor:not-allowed;border:1px solid var(--border2)}
  .noresults{background:var(--card);border:1px dashed #cbd5e1;border-radius:14px;padding:60px 20px;text-align:center;color:var(--muted)}
  .noresults svg{color:#cbd5e1}
  .noresults .t{font-weight:600;color:#475569;margin-top:12px}
  .noresults .d{font-size:14px;color:var(--muted2);margin-top:4px}
  .pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:24px;flex-wrap:wrap}
  .pager button{min-width:36px;height:36px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:13.5px;color:#475569;cursor:pointer;padding:0 10px}
  .pager button:hover:not(:disabled){background:#f8fafc}
  .pager button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .pager button:disabled{opacity:.4;cursor:not-allowed}
  .pager .dots{color:var(--muted2);padding:0 2px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.25s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{color:#34d399}
</style>
</head>

const PAGE_SIZE = 24;
let state = { q:"", medio:"", fuente:"", ciudad:"", tipoMedio:"", page:1 };

const $ = s => document.querySelector(s);
const norm = s => (s||"").toString().toLowerCase();

// Clasifica el valor libre de tipo_medio en una de las categorías fijas del filtro.
function classifyTipoMedio(d){
  const raw = norm(d.tipo_medio);
  if(!raw) return '';
  if(raw.includes('agencia')) return 'agencia';
  if(raw.includes('tv') || raw.includes('televis')) return 'tv';
  if(raw.includes('radio')) return 'radio';
  if(raw.includes('impreso') || raw.includes('prensa') || raw.includes('periodic') || raw.includes('diario')) return 'impreso';
  if(raw.includes('digital') || raw.includes('web') || raw.includes('podcast')) return 'digital';
  return '';
}

function uniqueSorted(key){
  const set = new Set();
  for(const d of DATA){ if(d[key]) set.add(d[key]); }
  return [...set].sort((a,b)=>a.localeCompare(b,'es'));
}

// Clasifica el texto libre de "fuente" en una de las 7 macro-categorías del filtro.
function classifyFuente(d){
  const raw = norm(d.fuente_full || d.fuente);
  if(!raw) return '';
  if(/mina|miner|energ|petrol|gas\b|sostenib|ambient|ecolog|clima/.test(raw)) return 'energia';
  if(/v[ií]a|vial|infraestructura|movilidad|transporte|aeropuerto|puerto|megaobra|obras/.test(raw)) return 'infra';
  if(/tecnolog|innovac|digital|gaming|internet/.test(raw)) return 'tecnologia';
  if(/pol[ií]tica|judicial|ddhh|gobierno|p[uú]blico|seguridad|conflicto|\bpaz\b|distrito|corrupci|congreso|orden p[uú]blico/.test(raw)) return 'politica';
  if(/entretenimiento|gastronom|turismo|cultura|moda|cine|m[uú]sica|deporte|ocio|mascota|farandula|espect[aá]culo/.test(raw)) return 'consumo';
  if(/educac|empleo|social|salud|vivienda|pobreza|g[eé]nero|familia|ni[ñn]ez|empleabilidad/.test(raw)) return 'social';
  if(/econom|finanz|negocio|empresa|mercado|macroeconom|agronegocio|comercio|banco|financier/.test(raw)) return 'economia';
  return '';
}

function fillSelect(el, opts, placeholder){
  el.innerHTML = '<option value="">'+placeholder+'</option>' +
    opts.map(o=>'<option value="'+o.replace(/"/g,'&quot;')+'">'+o+'</option>').join('');
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return DATA.filter(d=>{
    if(state.medio && d.medio!==state.medio) return false;
    if(state.fuente && classifyFuente(d)!==state.fuente) return false;
    if(state.ciudad && d.ciudad!==state.ciudad) return false;
    if(state.tipoMedio && classifyTipoMedio(d)!==state.tipoMedio) return false;
    if(q){
      const hay = norm(d.nombre).includes(q)||norm(d.medio).includes(q)||norm(d.fuente).includes(q)||norm(d.cargo).includes(q);
      if(!hay) return false;
    }
    return true;
  });
}

function esc(s){return (s||"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function waNumber(tel){
  let n = (tel||'').replace(/[^\d]/g,''); // deja solo dígitos
  if(!n) return '';
  if(n.startsWith('57') && n.length>10) return n; // ya tiene indicativo de Colombia
  if(n.length===10) return '57'+n; // celular colombiano sin indicativo
  return n; // deja como está si no calza con el patrón esperado
}

  ciudad:'<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',

};

// Plantilla del mensaje de WhatsApp — {nombre} se reemplaza por el nombre del periodista
const WA_MESSAGE_TEMPLATE = 'Hola {nombre}, te escribo de CROP...';

function buildWaLink(d){
  const num = waNumber(d.telefono);
  if(!num) return '';
  const msg = WA_MESSAGE_TEMPLATE.replace('{nombre}', d.nombre||'');
  return 'https://wa.me/'+num+'?text='+encodeURIComponent(msg);
}

function card(d){
  const fCat = classifyFuente(d);
  const fuente = d.fuente ? '<span class="tag'+(fCat?' tag-'+fCat:'')+'" title="'+esc(d.fuente)+'">'+esc(d.fuente)+'</span>' : '';
  const facts = [];
  if(d.medio) facts.push('<span>'+ICON.medio+esc(d.medio)+'</span>');
  if(d.ciudad) facts.push('<span>'+ICON.ciudad+esc(d.ciudad)+'</span>');
  const email = d.email
    ? '<a href="mailto:'+esc(d.email)+'">'+ICON.mail+'<span>'+esc(d.email)+'</span></a>'
    : '<a style="cursor:default">'+ICON.mail+'<span class="empty-field">Sin correo</span></a>';
  const phone = d.telefono
    ? '<a href="tel:'+esc(d.telefono)+'">'+ICON.phone+'<span>'+esc(d.telefono)+'</span></a>'
    : '<a style="cursor:default">'+ICON.phone+'<span class="empty-field">Sin teléfono</span></a>';

  const waLink = buildWaLink(d);
  const waBtn = waLink
    ? '<a class="b b-whatsapp" href="'+esc(waLink)+'" target="_blank" rel="noopener">'+ICON.whatsapp+' WhatsApp directo</a>'
    : '<span class="b b-disabled">'+ICON.whatsapp+' Sin número</span>';

  const copyEmailBtn = d.email
    ? '<button class="b b-dark" data-copy="'+esc(d.email)+'" data-label="¡Copiado!">'+ICON.copy+' Copiar correo</button>'
    : '<button class="b b-dark" disabled style="opacity:.4">'+ICON.copy+' Sin correo</button>';

  const copyPhoneBtn = d.telefono
    ? '<button class="b b-ghost" data-copy="'+esc(d.telefono)+'" data-label="¡Copiado!">'+ICON.copy+' Copiar teléfono</button>'
    : '<button class="b b-ghost" disabled style="opacity:.4">'+ICON.copy+' Sin teléfono</button>';

  const mailBtn = d.email
    ? '<a class="b b-ghost" href="mailto:'+esc(d.email)+'">'+ICON.mail+' Enviar correo</a>'
    : '<span class="b b-disabled">'+ICON.mail+' Sin correo</span>';

  return '<article class="card">'
    + '<div class="top"><div><h3>'+esc(d.nombre)+'</h3>'+(d.cargo?'<div class="role">'+esc(d.cargo)+'</div>':'')+'</div>'+fuente+'</div>'
    + (facts.length?'<div class="facts">'+facts.join('')+'</div>':'')
    + '<div class="divider"></div>'
    + '<div class="contact">'+email+phone+'</div>'
    + '<div class="cardbtns">'+waBtn+copyEmailBtn+copyPhoneBtn+mailBtn
    + '</div></article>';
}

function render(){
  const res = filtered();
  const total = DATA.length;
  const totalPages = Math.max(1, Math.ceil(res.length/PAGE_SIZE));
  if(state.page>totalPages) state.page=totalPages;
  const start=(state.page-1)*PAGE_SIZE;
  const items = res.slice(start, start+PAGE_SIZE);

  $('#shown').textContent = res.length.toLocaleString('es');
  $('#total').textContent = total.toLocaleString('es');
  $('#pageinfo').textContent = totalPages>1 ? ('Página '+state.page+' de '+totalPages) : '';
  $('#clearQ').style.display = state.q ? 'block':'none';

  const box = $('#results');
  if(items.length===0){
    box.className='';
    box.innerHTML='<div class="noresults"><svg width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><div class="t">Sin coincidencias</div><div class="d">Ajusta la búsqueda o limpia los filtros para ver más resultados.</div></div>';
  } else {
    box.className='grid';
    box.innerHTML = items.map(card).join('');
  }
  renderPager(totalPages);
}

function renderPager(totalPages){
  const p = state.page;
  const el = $('#pager');
  if(totalPages<=1){ el.innerHTML=''; return; }
  let html = '<button '+(p===1?'disabled':'')+' data-go="'+(p-1)+'">Anterior</button>';
  const pages = [];
  const add=n=>pages.push(n);
  add(1);
  if(p>3) pages.push('...');
  for(let i=Math.max(2,p-1);i<=Math.min(totalPages-1,p+1);i++) add(i);
  if(p<totalPages-2) pages.push('...');
  if(totalPages>1) add(totalPages);
  for(const n of pages){
    if(n==='...') html+='<span class="dots">…</span>';
    else html+='<button class="'+(n===p?'active':'')+'" data-go="'+n+'">'+n+'</button>';
  }
  html += '<button '+(p===totalPages?'disabled':'')+' data-go="'+(p+1)+'">Siguiente</button>';
  el.innerHTML = html;
}

let toastTimer;
function toast(msg){
  const t=$('#toast');
  t.innerHTML = ICON.check+' '+msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

async function copyText(text,label){
  try{ await navigator.clipboard.writeText(text); }
  catch{ const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
  toast(label);
}

// events
$('#q').addEventListener('input', e=>{ state.q=e.target.value; state.page=1; render(); });
$('#clearQ').addEventListener('click', ()=>{ state.q=''; $('#q').value=''; state.page=1; render(); });
$('#fMedio').addEventListener('change', e=>{ state.medio=e.target.value; state.page=1; render(); });
$('#fFuente').addEventListener('change', e=>{ state.fuente=e.target.value; state.page=1; render(); });
$('#fCiudad').addEventListener('change', e=>{ state.ciudad=e.target.value; state.page=1; render(); });
$('#fTipoMedio').addEventListener('change', e=>{ state.tipoMedio=e.target.value; state.page=1; render(); });
$('#clearAll').addEventListener('click', ()=>{
  state={q:'',medio:'',fuente:'',ciudad:'',tipoMedio:'',page:1};
  $('#q').value='';$('#fMedio').value='';$('#fFuente').value='';$('#fCiudad').value='';$('#fTipoMedio').value='';
  render();
});
document.addEventListener('click', e=>{
  const c = e.target.closest('[data-copy]');
  if(c && !c.disabled){ copyText(c.getAttribute('data-copy'), c.getAttribute('data-label')||'Copiado'); return; }
  const g = e.target.closest('[data-go]');
  if(g){ state.page=parseInt(g.getAttribute('data-go')); render(); window.scrollTo({top:0,behavior:'smooth'}); }
});

// init
fillSelect($('#fMedio'), uniqueSorted('medio'), 'Todos los medios');
fillSelect($('#fCiudad'), uniqueSorted('ciudad'), 'Todas las ciudades');
render();
</script>
